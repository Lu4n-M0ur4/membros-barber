<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros - Membros Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "yesfmi4kra");

</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" style="padding: 20px; justify-content: center; position: relative; border-bottom: 1px solid var(--color-border);">
                <input type="file" id="coverUpload" accept="image/*" style="display: none;">
                <label for="coverUpload" style="cursor: pointer; position: relative; display: block; width: 100%;">
                    <img id="sidebarLogo" src="assets/capa.jpg" alt="Logo Membros Barber" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: var(--transition);">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 8px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); color: white; font-size: 13px; font-weight: bold; text-transform: uppercase;" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0">
                        Alterar Capa
                    </div>
                </label>
                <button class="mobile-toggle close-sidebar" id="closeSidebar" style="color: var(--color-text-secondary); position: absolute; right: 10px; top: 10px; background: rgba(0,0,0,0.5); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10;">✕</button>
            </div>
            
            <ul class="nav-menu" id="navMenu">
                <!-- Abas serão geradas aqui dinamicamente -->
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar" id="userAvatar">A</div>
                    <div class="user-info">
                        <h4 id="userName">Carregando...</h4>
                        <p id="userRole">Membro</p>
                    </div>
                </div>
                <button class="btn-logout" id="btnLogout">Sair da Conta</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="mobile-toggle" id="openSidebar">☰</button>
                <div class="breadcrumb" id="breadcrumb">
                    Área de Membros > <span id="currentTabName">Início</span>
                </div>
            </header>

            <!-- Banner (usando imagem escura/dourada inspirada na capa) -->
            <div class="banner">
                <div class="banner-content" style="display: none;">
                    <h1 id="bannerTitle">Bem-vindo à Membros Barber</h1>
                    <p id="bannerDesc">O guia definitivo para o fade perfeito e a gestão do seu salão.</p>
                </div>
            </div>

            <!-- Área de renderização das abas -->
            <div class="content-area" id="contentArea">
                <div class="empty-state">
                    <h3>Carregando Plataforma...</h3>
                    <p>Preparando seus conteúdos.</p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="footer">
                &copy; 2026 Membros Barber. Todos os direitos reservados.
            </footer>
        </main>
    </div>

    <!-- Biblioteca PDF.js para renderizar PDF no Canvas (Funciona 100% em Mobile) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- Modal Visualizador de PDF Avançado (Cross-platform) -->
    <div id="pdfModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0A0A0A; z-index: 9999; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; border-bottom: 1px solid var(--color-primary); flex-wrap: wrap; gap: 10px;">
            <span style="color: var(--color-primary); font-weight: bold; font-size: 16px;">📚 Material do Curso</span>
            
            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 20px;">
                <button id="prevPage" style="background: transparent; color: var(--color-primary); border: none; font-size: 18px; cursor: pointer; padding: 0 10px;">◀</button>
                <span style="color: white; font-size: 14px;">Pág <span id="pageNum">1</span> de <span id="pageCount">?</span></span>
                <button id="nextPage" style="background: transparent; color: var(--color-primary); border: none; font-size: 18px; cursor: pointer; padding: 0 10px;">▶</button>
            </div>

            <button id="closePdfModal" style="background: transparent; color: white; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                ✖ Fechar
            </button>
        </div>
        <div id="pdfContainer" style="flex: 1; overflow: auto; text-align: center; padding: 20px; background: #1a1a1a; -webkit-overflow-scrolling: touch;">
            <canvas id="pdfCanvas" style="max-width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5);"></canvas>
        </div>
    </div>

    <script>
        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const canvas = document.getElementById('pdfCanvas'),
              ctx = canvas.getContext('2d');

        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                // Ajusta escala baseada no tamanho da tela
                const isMobile = window.innerWidth <= 768;
                const baseScale = isMobile ? (window.innerWidth / page.getViewport({ scale: 1 }).width) * 0.95 : 1.5;
                
                // Correção crucial para Celulares e Monitores Alta Definição (Retina)
                const outputScale = window.devicePixelRatio || 1;
                
                const viewport = page.getViewport({ scale: baseScale * outputScale });
                
                // Tamanho real da imagem renderizada (alta qualidade)
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                // Tamanho visual na tela (CSS)
                canvas.style.width = Math.floor(viewport.width / outputScale) + "px";
                canvas.style.height = Math.floor(viewport.height / outputScale) + "px";

                const renderCtx = { canvasContext: ctx, viewport };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });
                document.getElementById('pageNum').textContent = num;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('prevPage').addEventListener('click', () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            });

            document.getElementById('nextPage').addEventListener('click', () => {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            });

            document.getElementById('closePdfModal').addEventListener('click', () => {
                document.getElementById('pdfModal').style.display = 'none';
            });
        });

        // Função para abrir o PDF (mantive o nome downloadMaterial para aproveitar o botão)
        window.downloadMaterial = function(url) {
            document.getElementById('pdfModal').style.display = 'flex';
            
            // Renderiza o PDF
            pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('pageCount').textContent = pdfDoc.numPages;
                pageNum = 1;
                renderPage(pageNum);
            }).catch(err => {
                alert('Erro ao carregar o PDF. Ele pode estar corrompido ou inacessível.');
            });
        };

        // Função para forçar o download direto do arquivo (usada na aba Downloads)
        window.forceDownload = function(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = url.split('/').pop(); // Extrai o nome do arquivo
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

    <!-- Scripts de cada aba serão incluídos aqui conforme criados -->
    <script src="js/app.js"></script>
    <script src="js/cursos.js"></script>
    <script src="js/calculadora.js"></script>
    <script src="js/agenda.js"></script>
    <script src="js/downloads.js"></script>
    <script src="js/suporte.js"></script>
</body>
</html>
